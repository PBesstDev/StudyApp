<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyApp</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav id="top-nav">
    <button data-view="notes">Take Notes</button>
    <button data-view="transfer">Download/Upload Notes</button>
    <button data-view="study">Study</button>
  </nav>
  <main>
    <section id="notes-view" class="view active">
      <div id="notes-container"></div>
    </section>
    <section id="transfer-view" class="view">
      <div id="transfer-container"></div>
    </section>
    <section id="study-view" class="view">
      <div id="study-container"></div>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
